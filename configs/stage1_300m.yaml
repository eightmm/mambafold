# MambaFold — Stage 1 PT, 300M scale (L=512, short-crop)
#
# Scaled-up Stage 1 (~307M params). Scaling philosophy: params go into the
# O(L) Mamba trunk (cheap at inference even when param-big), while the O(L²)
# pair stack is held at the current size so inference compute doesn't grow.
#
#   trunk: d_res=1024, 20 BiMamba layers (weight-tied), RoPE attention every 6
#          layers (→ layers 5/11/17, ~1:6 interleaved hybrid, à la Jamba/Nemotron)
#   pair:  d_pair=192, 6 Pairmixer blocks (depth = the topology lever), cuEq fused
#
# Includes the chirality loss (fixes the ~35–43% mirror-image failures), monomer
# extraction (~10× data), length bucketing, and cuEq fused trimul.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 CONFIG=configs/stage1_300m.yaml bash scripts/train.sh

# ── Model dispatch ────────────────────────────────────────────────────────
stage: 1

# ── Data ──────────────────────────────────────────────────────────────────
data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 512
batch_size: 6
num_workers: 16
copies_per_protein: 1
single_chain_only: true       # (superseded by extract_monomer_chains)
extract_monomer_chains: true  # each protein chain as its own monomer (~10× data)
grad_accum_steps: 4           # effective batch = 4 GPU × 6 × 4 = 96

# ── Length-balanced sampling ──────────────────────────────────────────────
length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5

# ── Padding-waste controls ────────────────────────────────────────────────
length_bucketing: true
length_bin: 128

crop_schedule:
  - weights: {512: 1.0}

# ── Output ────────────────────────────────────────────────────────────────
out_dir: null
resume: null

# ── Training ──────────────────────────────────────────────────────────────
total_steps: 60_000
lr: 1.0e-4
warmup_steps: 3_000
grad_clip: 1.0
t_schedule: uniform
ema_decay: 0.999
log_interval: 50
ckpt_interval: 5_000
eval_interval: 5_000
seed: 0

# ── Stage 1 model dims (300M scale: deeper tied trunk, width unchanged) ────
d_res: 1024
n_trunk: 20                   # 12 → 20 BiMamba layers (depth; O(L) → inference stays fast)
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 64
mimo_rank: 4
expand: 2
headdim: 64
bimamba_share: true           # weight-tied bidirectional (param-efficient; ~1.4× more capacity/param)

# ── Hybrid trunk: RoPE self-attention interleaved every 6 layers ───────────
# attn_every=6 → attention at layers 5/11/17 (3 of 20, ~1:6). Interleaved
# through depth (not end-loaded) so global mixing informs intermediate
# representations — the proven Jamba/Nemotron-H pattern.
trunk_attn_layers: null
trunk_attn_every: 6
n_attn_heads: 16

# ── Pair stack — depth bumped 4→6 (the genuine-fail topology lever) ────────
# pair is the proven bottleneck; triangle-mult reasoning scales with DEPTH
# (AF2/AF3 use ~48 blocks @ dim 128). d_pair=192 is already wider than AF, so
# grow blocks, not width. cuEq's ~37% memory cut makes 6 blocks fit at L=1024
# (was "too tight" before cuEq). ~1.5× pair O(L²) vs 4 blocks; still light.
d_pair: 192
n_pair_blocks: 6
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: true

# ── Loss composition (Stage 1) ─────────────────────────────────────────
w_lddt_ca:       1.0
w_bond_caca:     0.1
w_distogram:     0.5
w_drmsd:         0.5
w_contact:       0.3
w_pcb:           0.2
w_conf:          0.05
w_ca_angle:      0.1
w_ca_self_clash: 0.1
w_chirality:     0.5          # mirror-image (handedness) penalty
alpha_mode: ramp

n_cycles_train: 2

# ── PLM (ESM3) ────────────────────────────────────────────────────────────
use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

# ── W&B ───────────────────────────────────────────────────────────────────
wandb_project: mambafold
wandb_name: null
wandb_tags: [stage1_pt, single_chain, ca_only, 300M, tied, attn_every6, chirality, L_512]
wandb_offline: false
no_wandb: false
