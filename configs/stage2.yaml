# MambaFold — Stage 2 (All-atom FM, CA-conditioned on frozen Stage 1)
#
# Phase 2 of the coarse-to-fine pipeline. Stage 1's weights are loaded
# from `stage1_ckpt`, frozen, and used to produce (s1_ca, s1_latent)
# for Stage 2 each step. Only Stage 2 parameters update.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 \
#     CONFIG=configs/stage2.yaml \
#     STAGE1_CKPT=outputs/train/<phase1_run>/ckpt_latest.pt \
#     bash scripts/train.sh
#
# (stage1_ckpt can also be set directly in this YAML if scripts/train.sh
#  is invoked without an env var override.)

# ── Model dispatch ────────────────────────────────────────────────────────
stage: 2

# Stage 1 ckpt — must be a Phase-1 output. Wire via env var
# in scripts/train.sh or override here.
stage1_ckpt: null    # e.g. outputs/train/<phase1_run>/ckpt_latest.pt

# ── Data (unchanged from Stage 1) ─────────────────────────────────────────
data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 1024
batch_size: 1                 # per-GPU; freeze_stage1 saves activations so we
                              # could bump to 2 if memory allows — verify on launch
num_workers: 16
copies_per_protein: 1
single_chain_only: true
grad_accum_steps: 24          # effective 96 (matches Stage 1 CT)

# Stage 2 runs only at L=1024 (matches Stage 1's CT regime — no curriculum).
crop_schedule: null

# ── Output ────────────────────────────────────────────────────────────────
out_dir: null
resume: null

# ── Training (30K Phase 2) ────────────────────────────────────────────────
total_steps: 30_000
lr: 1.0e-4
warmup_steps: 1_000
grad_clip: 1.0
t_schedule: uniform
ema_decay: 0.999
log_interval: 50
ckpt_interval: 2_500
eval_interval: 2_500
seed: 1                       # different seed from Phase 1

# ── Stage 1 model dims (must match Phase-1 ckpt to load cleanly) ──────────
d_res: 1024
n_trunk: 12
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_pair: 192
n_pair_blocks: 4
n_pair_heads: 4
d_pair_head: 48
pair_mult_c: 128
d_state: 64
mimo_rank: 4
expand: 2
headdim: 64
n_cycles_train: 2             # frozen Stage 1 runs the same 2-cycle as Phase 1

# ── Stage 2 model dims ────────────────────────────────────────────────────
d_atom: 384
d_res_polish: 512
n_atom_enc: 4
n_polish: 4
n_atom_dec: 4
d_ca_anchor: 64
d_atom_slot: 32
d_fourier: 128

# ── Loss composition (Stage 2) ─────────────────────────────────────────
w_lddt_full:   1.0            # CA/all-atom lDDT; Stage 2 may refine CA
w_bond:        0.05           # full backbone bond geometry
w_clash:       0.01           # intra-chain C-alpha clash
w_ca_anchor:   2.0            # keep refined CA near Stage 1 scaffold
ca_condition_noise_std: 0.03  # normalized coords; ~0.3 A
ca_condition_noise_prob: 0.5
alpha_mode: ramp

# ── PLM (ESM3) ────────────────────────────────────────────────────────────
use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

# ── W&B ───────────────────────────────────────────────────────────────────
wandb_project: mambafold
wandb_name: null
wandb_tags: [stage2, single_chain, all_atom_refine, ca_residual_refine, frozen_s1]
wandb_offline: false
no_wandb: false
