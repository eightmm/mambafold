# Pure-Mamba direct all-atom ablation: layer-wise time FiLM + small geometry.
#
# Isolates whether light physical supervision improves local validity after
# layer-wise time conditioning. Pair stack and token attention remain disabled.

data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 1024
batch_size: 4
num_workers: 16
copies_per_protein: 1
single_chain_only: true
extract_monomer_chains: true
length_bin: 128

length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5
length_bucketing: true

crop_schedule:
  - weights: {1024: 1.0}

out_dir: null
resume: null

total_steps: 20_000
lr: 1.0e-4
warmup_steps: 1_000
grad_clip: 1.0
t_schedule: logit_normal
ema_decay: 0.999
log_interval: 50
ckpt_interval: 2_000
eval_interval: 2_000
seed: 0
grad_accum_steps: 24
find_unused_parameters: true

d_res: 1024
n_trunk: 17
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 128
mimo_rank: 4
expand: 2
headdim: 64
bimamba_share: false

trunk_attn_layers: []
trunk_attn_every: null
n_attn_heads: 16
trunk_time_film: true

use_pair_stack: false
d_pair: 192
n_pair_blocks: 0
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: false

d_atom: 128
n_atom_layers: 4

w_fm:            1.0
w_lddt_atom:     1.0
w_lddt_ca:       1.0
w_drmsd:         0.75
w_bond:          0.02
w_clash:         0.01
w_ca_clash:      0.005
w_distogram:     0.0
w_contact:       0.0
w_pcb:           0.0
w_conf:          0.0
w_ca_angle:      0.05
w_ca_self_clash: 0.05
w_chirality:     0.2
w_chirality_atom: 0.2
alpha_mode: ramp
max_lddt_atoms:  2048
max_clash_atoms: 2048

use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

wandb_project: mambafold
wandb_name: null
wandb_tags: [direct_allatom, pure_mamba, layerwise_time_film, small_geometry, global20k, single_chain, L_1024]
wandb_offline: false
no_wandb: false
