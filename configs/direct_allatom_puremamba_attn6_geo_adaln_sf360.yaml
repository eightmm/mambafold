# MambaFold mainline: SimpleFold-360M-matched sparse attention + geometry + AdaLN-Zero.
#
# Architecture decision:
#   explicit pair stack was slower without clear gain; use pair-free residue
#   trunk with sparse global attention and lightweight geometry supervision.
# Keeps max_length=1024 by project decision, but matches the comparable
# SimpleFold-360M knobs: residue dim 1024, 18 trunk blocks, 16 heads,
# atom enc/dec dim 256, 2 atom enc/dec blocks, effective batch 512,
# lr 1e-4, warmup 5000, EMA 0.999.

data_dir:      data/rcsb_boltz_official_full
val_data_dir:  data/rcsb_boltz_official_full
file_list:     data/splits/train_boltz_official_full.txt
val_file_list: data/splits/val_boltz_official_full.txt
train_sources:
  - name: rcsb
    data_dir: data/rcsb_boltz_official_full
    file_list: data/splits/train_boltz_official_full.txt
    esm_dir: data/rcsb_esm_official_full
  - name: afdb_swissprot
    data_dir: data/afdb_swissprot/npz
    file_list: null
    esm_dir: data/afdb_swissprot_esm
max_length: 1024
batch_size: 4
num_workers: 16
copies_per_protein: 1
single_chain_only: true
extract_monomer_chains: true
length_bin: 128

length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5
length_bucketing: true

crop_schedule:
  - weights: {1024: 1.0}

out_dir: null
resume: null

total_steps: 170_000
lr: 1.0e-4
warmup_steps: 5_000
grad_clip: 1.0
t_schedule: logit_normal
ema_decay: 0.999
log_interval: 50
ckpt_interval: 10_000
eval_interval: 5_000
seed: 0
grad_accum_steps: 32
find_unused_parameters: true

d_res: 1024
n_trunk: 18
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 128
mimo_rank: 4
expand: 2
headdim: 64
bimamba_share: false

trunk_attn_layers: null
trunk_attn_every: 6
n_attn_heads: 16
trunk_time_film: true
trunk_adaln_zero: true

use_pair_stack: false
d_pair: 192
n_pair_blocks: 0
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: false

d_atom: 256
n_atom_layers: 2

w_fm:            1.0
w_lddt_atom:     1.0
w_lddt_ca:       1.0
w_drmsd:         0.75
w_bond:          0.02
w_clash:         0.01
w_ca_clash:      0.005
w_distogram:     0.0
w_contact:       0.0
w_pcb:           0.0
w_conf:          0.0
w_ca_angle:      0.05
w_ca_self_clash: 0.05
w_chirality:     0.2
w_chirality_atom: 0.2
alpha_mode: ramp
max_lddt_atoms:  2048
max_clash_atoms: 2048

use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm_official_full

wandb_project: mambafold
wandb_name: null
wandb_tags: [direct_allatom, pure_mamba, attn_every_6, small_geometry, adaln_zero, mainline, single_chain, L_1024]
wandb_offline: false
no_wandb: false
