# MambaFold — Stage 1 CT, 300M scale (L=1024, continued training)
#
# Resumes from the 300M PT ckpt (configs/stage1_300m.yaml) and continues at
# L=1024. Model dims MUST match the PT ckpt exactly for resume.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 CONFIG=configs/stage1_ct_300m.yaml \
#     RESUME=outputs/train/<pt_300m_run>/ckpt_latest.pt bash scripts/train.sh

stage: 1

# ── Data ──────────────────────────────────────────────────────────────────
data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 1024
batch_size: 1
num_workers: 16
copies_per_protein: 1
single_chain_only: true
extract_monomer_chains: true
grad_accum_steps: 24          # effective = 4·1·24 = 96 (matches PT)

length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5

# batch_size=1 → bucketing moot; length_bin dynamic-pads each protein to its
# 128-multiple instead of the fixed 1024 crop.
length_bin: 128

crop_schedule:
  - weights: {1024: 1.0}

out_dir: null
resume: null                  # passed via RESUME env (PT 300M ckpt)

# ── Training (resumes PT step counter; CT runs to total) ──────────────────
total_steps: 100_000
lr: 1.0e-4
warmup_steps: 3_000           # ignored past warmup
grad_clip: 1.0
t_schedule: uniform
ema_decay: 0.999
log_interval: 50
ckpt_interval: 5_000
eval_interval: 0
seed: 0

# ── Stage 1 model dims (MUST match 300M PT ckpt) ──────────────────────────
d_res: 1024
n_trunk: 20
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 64
mimo_rank: 4
expand: 2
headdim: 64
bimamba_share: true

trunk_attn_layers: null
trunk_attn_every: 6
n_attn_heads: 16

d_pair: 192
n_pair_blocks: 6              # matches PT 300M; 6 blocks @ L=1024 fits with cuEq
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: true           # ~3× @L=1024 + ~37% memory cut (needed for 6 blocks)

# ── Loss composition (identical to 300M PT) ───────────────────────────────
w_lddt_ca:       1.0
w_bond_caca:     0.1
w_distogram:     0.5
w_drmsd:         0.5
w_contact:       0.3
w_pcb:           0.2
w_conf:          0.05
w_ca_angle:      0.1
w_ca_self_clash: 0.1
w_chirality:     0.5
alpha_mode: ramp

n_cycles_train: 2

use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

wandb_project: mambafold
wandb_name: null
wandb_tags: [stage1_ct, single_chain, ca_only, 300M, tied, attn_every6, chirality, L_1024]
wandb_offline: false
no_wandb: false
