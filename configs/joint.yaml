# MambaFold — Phase 3 Joint Finetune (both stages trainable)
#
# Loads from a Phase-2 TwoStage ckpt (preferred) and unfreezes Stage 1 so
# both stages update together with a small learning rate. Distogram aux on
# Stage 1's pair stack stays active (return_aux=True inside engine).
#
# Usage (recommended — warm start from Phase 2):
#   CUDA_VISIBLE_DEVICES=0,1,2,3 \
#     CONFIG=configs/joint.yaml \
#     JOINT_INIT_CKPT=outputs/train/<phase2_run>/ckpt_latest.pt \
#     bash scripts/train.sh
#
# Fallback (if Phase 2 was skipped — Stage 2 starts fresh):
#   STAGE1_CKPT=outputs/train/<phase1_run>/ckpt_latest.pt \
#     CONFIG=configs/joint.yaml \
#     bash scripts/train.sh

# ── Model dispatch ────────────────────────────────────────────────────────
stage: joint

# One of the two ckpts MUST be set (env override or here):
joint_init_ckpt: null   # e.g. outputs/train/<phase2_run>/ckpt_latest.pt
stage1_ckpt: null       # e.g. outputs/train/<phase1_run>/ckpt_latest.pt

# ── Data ──────────────────────────────────────────────────────────────────
data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 1024
batch_size: 1                 # joint = full TwoStage active → max memory pressure
num_workers: 16
copies_per_protein: 1
single_chain_only: true
grad_accum_steps: 24

crop_schedule: null

# ── Output ────────────────────────────────────────────────────────────────
out_dir: null
resume: null

# ── Training (30K Phase 3, small lr) ──────────────────────────────────────
total_steps: 30_000
lr: 5.0e-5                    # half of Phase 1/2 (1e-4) — finetune regime
warmup_steps: 500             # short warmup since both stages already pretrained
grad_clip: 0.5                # tighter clip to avoid S1 catastrophic drift
t_schedule: uniform
ema_decay: 0.999
log_interval: 50
ckpt_interval: 2_500
eval_interval: 2_500
seed: 2

# ── Stage 1 model dims (must match Phase-1/Phase-2 ckpts) ─────────────────
d_res: 1024
n_trunk: 12
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_pair: 192
n_pair_blocks: 4
n_pair_heads: 4
d_pair_head: 48
pair_mult_c: 128
d_state: 64
mimo_rank: 4
expand: 2
headdim: 64
n_cycles_train: 2

# ── Stage 2 model dims (must match Phase-2 ckpt) ──────────────────────────
d_atom: 384
d_res_polish: 512
n_atom_enc: 4
n_polish: 4
n_atom_dec: 4
d_ca_anchor: 64
d_atom_slot: 32
d_fourier: 128

# ── Loss composition (joint) ──────────────────────────────────────────────
# Stage 1 sub-weights
w_lddt_ca:       1.0
w_bond_caca:     0.1
w_distogram:     0.5
w_drmsd:         0.5
w_contact:       0.3
w_pcb:           0.2
w_conf:          0.05
w_ca_angle:      0.1
w_ca_self_clash: 0.1
# Stage 2 sub-weights
w_lddt_full:     1.0
w_bond:          0.05
w_clash:         0.01
w_ca_anchor:     2.0
ca_condition_noise_std: 0.03
ca_condition_noise_prob: 0.5
# Global balance: how much weight on S1 vs S2 in the composite.
w_stage1:        1.0
alpha_mode: ramp

# ── PLM (ESM3) ────────────────────────────────────────────────────────────
use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

# ── W&B ───────────────────────────────────────────────────────────────────
wandb_project: mambafold
wandb_name: null
wandb_tags: [joint, single_chain, phase3, both_stages_trainable]
wandb_offline: false
no_wandb: false
