# MambaFold — Stage 1 CT (Continued Training, L=1024, long-context)
#
# Phase 1b. Resumes from the PT ckpt (60K steps at L=512) and continues
# training at L=1024 for an additional 40K steps (total 100K). Batch size
# drops to 1 per GPU because the L=1024 pair tensor needs the headroom.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 \
#     CONFIG=configs/stage1_ct.yaml \
#     RESUME=outputs/train/<pt_run>/ckpt_latest.pt \
#     bash scripts/train.sh
#
# The trainer's resume path picks up step 60000 and rolls forward to
# total_steps=100000 (so 40K new CT steps).

# ── Model dispatch ────────────────────────────────────────────────────────
stage: 1

# ── Data ──────────────────────────────────────────────────────────────────
data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 1024              # CT — long context
batch_size: 1                 # per-GPU; L=1024 pair stack needs all VRAM at b=1
num_workers: 16
copies_per_protein: 1
single_chain_only: true       # (superseded by extract_monomer_chains)
extract_monomer_chains: true  # each protein chain as its own monomer example

grad_accum_steps: 24          # effective = 4·1·24 = 96 (matches PT)

# Length-balanced sampling (same as PT — keeps long proteins upweighted)
length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5

# batch_size=1 → no bucketing needed, but length_bin still pads each single
# protein to its 128-multiple instead of the fixed 1024 crop (dynamic padding).
length_bin: 128

# Crop schedule — CT only (single phase L=1024)
crop_schedule:
  - weights: {1024: 1.0}

# ── Output ────────────────────────────────────────────────────────────────
out_dir: null
resume: null                  # passed via RESUME env var (PT ckpt path)

# ── Training (40K additional steps; trainer resumes step counter) ─────────
total_steps: 100_000          # absolute; PT ended at 60000, CT runs 60K→100K
lr: 1.0e-4                    # same as PT — schedule continues
warmup_steps: 3_000           # ignored since we're past warmup
grad_clip: 1.0
t_schedule: uniform
ema_decay: 0.999
log_interval: 50
ckpt_interval: 5_000
eval_interval: 0              # Disable long rank0-only val during CT; run eval after 100K.
seed: 0

# ── Stage 1 model dims (identical to PT — required for resume) ────────────
d_res: 1024
n_trunk: 12
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 64
mimo_rank: 4
expand: 2
headdim: 64

# Nemotron-style hybrid trunk (must match PT ckpt)
trunk_attn_layers: [10, 11]
n_attn_heads: 16

d_pair: 192
n_pair_blocks: 4
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: true           # cuEq fused trimul — ~3× @L=1024 (must match PT ckpt)

# ── Loss composition (identical to PT) ────────────────────────────────────
w_lddt_ca:       1.0
w_bond_caca:     0.1
w_distogram:     0.5
w_drmsd:         0.5
w_contact:       0.3
w_pcb:           0.2
w_conf:          0.05
w_ca_angle:      0.1
w_ca_self_clash: 0.1
w_chirality:     0.5          # mirror-image penalty
alpha_mode: ramp

# Stage 1 recycling (identical to PT — required for resume).
n_cycles_train: 2

# ── PLM ───────────────────────────────────────────────────────────────────
use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

# ── W&B ───────────────────────────────────────────────────────────────────
wandb_project: mambafold
wandb_name: null
wandb_tags: [stage1_ct, single_chain, ca_only, linear_tri_attn, pair_x4, L_1024]
wandb_offline: false
no_wandb: false
