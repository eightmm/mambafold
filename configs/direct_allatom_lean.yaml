# MambaFold - SimpleFold-lean loss ablation (FM + alpha(t)*all-atom LDDT only).
#
# Purpose:
#   Isolate loss composition. Identical model/data/schedule to
#   direct_allatom_360m.yaml, but the objective is the faithful SimpleFold
#   recipe (arXiv:2509.18480): ell = ell_FM + alpha(t) * ell_LDDT, all other
#   auxiliaries OFF. Use to test whether our ~12 extra aux losses (distogram,
#   contact, drmsd, pcb, conf, chirality, bond, clash, ...) actually improve
#   lDDT / mirror-rate over the lean baseline, or just dilute the FM field.
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2,3 CONFIG=configs/direct_allatom_lean.yaml bash scripts/train.sh

# Data
data_dir:      data/rcsb
val_data_dir:  data/rcsb
file_list:     data/splits/train.txt
val_file_list: data/splits/val.txt
max_length: 1024
batch_size: 4
num_workers: 16
copies_per_protein: 1
single_chain_only: true
extract_monomer_chains: true
length_bin: 128

length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5
length_bucketing: true

crop_schedule:
  - weights: {1024: 1.0}

out_dir: null
resume: null

# Training
total_steps: 100_000
lr: 1.0e-4
warmup_steps: 3_000
grad_clip: 1.0
t_schedule: logit_normal   # SimpleFold: p(t)=0.98*LN(0.8,1.7)+0.02*U(0,1)
ema_decay: 0.999
log_interval: 50
ckpt_interval: 5_000
eval_interval: 5_000
seed: 0
grad_accum_steps: 12

# Model — identical to direct_allatom_360m.yaml so the ablation isolates loss only.
d_res: 1024
n_trunk: 17
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 128
mimo_rank: 4
expand: 2
headdim: 64
bimamba_share: false

trunk_attn_layers: [15, 16]
trunk_attn_every: null
n_attn_heads: 16

d_pair: 192
n_pair_blocks: 4
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: true

d_atom: 128
n_atom_layers: 4

# Loss composition — SimpleFold-lean: FM + alpha(t)*all-atom LDDT, nothing else.
# (distogram/contact/pcb/conf heads still run in forward but get zero loss weight.)
w_fm:            1.0   # core flow-matching velocity (generative objective)
w_lddt_atom:     1.0   # SimpleFold's single auxiliary, weighted by alpha(t)
w_lddt_ca:       0.0
w_bond:          0.0
w_clash:         0.0
w_ca_clash:      0.0
w_distogram:     0.0
w_drmsd:         0.0
w_contact:       0.0
w_pcb:           0.0
w_conf:          0.0
w_ca_angle:      0.0
w_ca_self_clash: 0.0
w_chirality:     0.0
w_chirality_atom: 0.0
alpha_mode: ramp           # SimpleFold's time-dependent alpha(t)
max_lddt_atoms:  2048
max_clash_atoms: 2048

use_plm: true
d_plm: 1536
esm_dir: data/rcsb_esm

wandb_project: mambafold
wandb_name: null
wandb_tags: [direct_allatom, lean_ablation, simplefold_loss, single_chain, 390M, L_1024]
wandb_offline: false
no_wandb: false
