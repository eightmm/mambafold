# MambaFold Ada mainline conditioned on pinned sequence-only ESMC-6B embeddings.
# This config is intentionally checkpoint-incompatible with the ESM3 variant:
# ESMC-6B emits 2560-dimensional embeddings instead of 1536.
# d_state=64 keeps the official Mamba-3 MIMO backward kernel below the RTX
# 6000 Ada per-block shared-memory limit; the former d_state=128 model remains
# available through its ESM3 config/checkpoint and is not resumed here.

data_dir:      data/rcsb_boltz_official_full
val_data_dir:  data/rcsb_boltz_official_full
file_list:     data/splits/train_boltz_official_full.txt
val_file_list: data/splits/val_boltz_official_full.txt
train_sources:
  - name: rcsb
    data_dir: data/rcsb_boltz_official_full
    file_list: data/splits/train_boltz_official_full.txt
    esm_dir: data/rcsb_esmc6b_official_full
  - name: afdb_swissprot
    data_dir: data/afdb_swissprot/npz
    file_list: null
    esm_dir: data/afdb_swissprot_esmc6b
max_length: 1024
# RTX 6000 Ada calibration: 4 ranks, 9 examples/GPU. The L=1024 gate includes
# initialized AdamW state and all 13 no_sync accumulation micro-steps:
# 43.469 GiB allocated, 43.699/47.372 GiB reserved per GPU.
batch_size: 9
num_workers: 16
prefetch_factor: 1
copies_per_protein: 1
single_chain_only: true
extract_monomer_chains: true
length_bin: 128

length_balanced_sampling: true
metadata_path: data/splits/metadata.tsv
length_balance_mode: power
length_balance_exponent: 0.5
length_balance_clip_min: 1.0
length_balance_clip_max: 1.5
length_bucketing: true

crop_schedule:
  - weights: {1024: 1.0}

out_dir: outputs/train/direct_puremamba_attn6_geo_adaln_sf360_esmc6b_ada_dstate64_gpu4_v4
resume: null

total_steps: 170_000
lr: 1.0e-4
warmup_steps: 5_000
grad_clip: 1.0
t_schedule: logit_normal
ema_decay: 0.999
log_interval: 50
ckpt_interval: 10_000
eval_interval: 5_000
seed: 0
grad_accum_steps: 13
find_unused_parameters: true

d_res: 1024
n_trunk: 18
d_res_type: 32
d_res_pos: 64
d_plm_proj: 256
d_ca_emb: 128
d_state: 64
mimo_rank: 4
expand: 2
headdim: 64
bimamba_share: false

trunk_attn_layers: null
trunk_attn_every: 6
n_attn_heads: 16
trunk_time_film: true
trunk_adaln_zero: true

use_pair_stack: false
d_pair: 192
n_pair_blocks: 0
n_pair_heads: 4
pair_mult_c: 128
pair_use_cueq: false

d_atom: 256
n_atom_layers: 2

w_fm:            1.0
w_lddt_atom:     1.0
w_lddt_ca:       1.0
w_drmsd:         0.75
w_bond:          0.02
w_clash:         0.01
w_ca_clash:      0.005
w_distogram:     0.0
w_contact:       0.0
w_pcb:           0.0
w_conf:          0.0
w_ca_angle:      0.05
w_ca_self_clash: 0.05
w_chirality:     0.2
w_chirality_atom: 0.2
alpha_mode: ramp
max_lddt_atoms:  2048
max_clash_atoms: 2048

use_plm: true
d_plm: 2560
esm_dir: data/rcsb_esmc6b_official_full

wandb_project: mambafold
wandb_name: direct_puremamba_attn6_geo_adaln_sf360_esmc6b_ada_dstate64_gpu4_v4
wandb_tags: [direct_allatom, pure_mamba, attn_every_6, small_geometry, adaln_zero, mainline, single_chain, L_1024, esmc6b, ada, dstate64, gpu4, batch468, expandable_segments, memory_efficient_lddt, from_scratch]
wandb_offline: false
no_wandb: false
