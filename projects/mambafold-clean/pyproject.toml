[project]
name = "mambafold"
version = "0.1.0"
description = "Mamba-based all-atom protein structure prediction with flow matching and PLM conditioning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "einops>=0.8",
    "pyyaml>=6.0",
    "wandb>=0.18",
    "biopython>=1.84",
    "numpy>=1.26",
    "scipy>=1.13",
    "esm>=3.2.3",
    "causal-conv1d>=1.4",
    "mamba-ssm",
    "nvidia-cuda-cccl==13.0.85; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mambafold"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Pipeline stages put `src` and `pipeline/lib` on sys.path before importing from
# them, so their imports cannot sit at the top of the file.
"pipeline/*.py" = ["E402"]
"pipeline/lib/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The shared venv carries an editable install of `mambafold` pointing at the
# previous track. Without this, every test imports that source instead of
# this root's, and nothing errors — it just tests the wrong code.
pythonpath = ["src"]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu130"]
no-build-isolation-package = ["mamba-ssm"]

[tool.uv.sources]
causal-conv1d = { url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.6.1.post4/causal_conv1d-1.6.1%2Bcu13torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
mamba-ssm = { git = "https://github.com/state-spaces/mamba.git" }
