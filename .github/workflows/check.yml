name: check
on:
  push:
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Syntax-only: the test suite needs CUDA/torch and runs on the cluster.
      - run: python -m compileall -q scripts src benchmarks tests
